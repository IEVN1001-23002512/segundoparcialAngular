<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow">

  <div class="flex justify-start mb-6">

    <button
      type="button"
      [routerLink]="['/formularios/zodiaco']"
      class="text-white bg-blue-700 hover:bg-blue-800
             font-medium rounded-lg text-sm px-5 py-2.5"
    >
      Regresar al Zodiaco
    </button>

  </div>

@if (formEditar) {
  <div>

      <form [formGroup]="formulario" (ngSubmit)="guardarEdicion()">

        <fieldset class="border border-gray-400 p-5">

          <legend class="text-lg font-medium px-2">
            Editar registro
          </legend>

          <div class="mb-4">

            <label
              for="nombre"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Nombre
            </label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              formControlName="nombre"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Nombre"
            >

          </div>


          <div class="mb-4">

            <label
              for="apaterno"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Apellido paterno
            </label>

            <input
              type="text"
              id="apaterno"
              name="apaterno"
              formControlName="apaterno"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Apellido paterno"
            >

          </div>


          <div class="mb-4">

            <label
              for="amaterno"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Apellido materno
            </label>

            <input
              type="text"
              id="amaterno"
              name="amaterno"
              formControlName="amaterno"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Apellido materno"
            >

          </div>


          <div class="mb-4">

            <label class="block mb-2 text-sm font-medium text-gray-900">
              Fecha de nacimiento
            </label>

            <div class="grid grid-cols-3 gap-2">

              <div>

                <label
                  for="dia"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Día
                </label>

                <input
                  type="number"
                  id="dia"
                  name="dia"
                  formControlName="dia"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Día"
                >

              </div>


              <div>

                <label
                  for="mes"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Mes
                </label>

                <input
                  type="number"
                  id="mes"
                  name="mes"
                  formControlName="mes"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Mes"
                >

              </div>


              <div>

                <label
                  for="anio"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Año
                </label>

                <input
                  type="number"
                  id="anio"
                  name="anio"
                  formControlName="anio"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Año"
                >

              </div>

            </div>

          </div>


          <div class="mb-5">

            <label class="block mb-2 text-sm font-medium text-gray-900">
              Sexo
            </label>

            <div class="flex flex-col gap-2">

              <label class="flex items-center">
                <input
                  type="radio"
                  name="sexo"
                  value="Masculino"
                  formControlName="sexo"
                  class="w-4 h-4"
                >
                <span class="ml-2 text-sm text-gray-900">
                  Masculino
                </span>
              </label>

              <label class="flex items-center">
                <input
                  type="radio"
                  name="sexo"
                  value="Femenino"
                  formControlName="sexo"
                  class="w-4 h-4"
                >
                <span class="ml-2 text-sm text-gray-900">
                  Femenino
                </span>
              </label>

            </div>

          </div>


          <div class="flex justify-center mt-5">

            <button
              type="submit"
              class="text-white bg-blue-700 hover:bg-blue-800
                     focus:ring-4 focus:outline-none focus:ring-blue-300
                     font-medium rounded-lg text-sm px-5 py-2.5"
            >
              Guardar
            </button>

            <button
              type="button"
              (click)="cancelarEdicion()"
              class="text-white bg-blue-700 hover:bg-blue-800
                     focus:ring-4 focus:outline-none focus:ring-blue-300
                     font-medium rounded-lg text-sm px-5 py-2.5"
            >
              Cancelar
            </button>

          </div>

        </fieldset>

      </form>

  </div>
}

  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Historial de signos zodiacales
  </h2>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">

    <table class="w-full text-sm text-left text-gray-500">

      <thead class="text-xs text-gray-700 uppercase bg-gray-100">

        <tr>
          <th scope="col" class="px-6 py-3">
            Nombre completo
          </th>

          <th scope="col" class="px-6 py-3">
            Sexo
          </th>

          <th scope="col" class="px-6 py-3">
            Edad
          </th>

          <th scope="col" class="px-6 py-3">
            Signo
          </th>

          <th scope="col" class="px-6 py-3">
            Imagen
          </th>

          <th scope="col" class="px-6 py-3">
            Acciones
          </th>
        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let fila of registro; let i = index"
          class="bg-white border-b border-gray-200 hover:bg-gray-50"
        >

          <td class="px-6 py-4 font-medium text-gray-900">
            {{ fila.nombre }}
            {{ fila.apaterno }}
            {{ fila.amaterno }}
          </td>

          <td class="px-6 py-4">
            {{ fila.sexo }}
          </td>

          <td class="px-6 py-4">
            {{ fila.edad }}
          </td>

          <td class="px-6 py-4">
            {{ fila.signo }}
          </td>

          <td class="px-6 py-4">
            <img
              [src]="fila.imagen"
              [alt]="fila.signo"
              class="w-16 h-16 object-contain"
            >
          </td>

          <td class="px-6 py-4">

            <div class="flex gap-2">

              <button
                type="button"
                (click)="editar(i)"
                class="px-4 py-2 text-sm font-medium text-white
                       bg-green-600 rounded-lg hover:bg-green-700"
              >
                Editar
              </button>

              <button
                type="button"
                (click)="eliminar(i)"
                class="px-4 py-2 text-sm font-medium text-white
                       bg-red-600 rounded-lg hover:bg-red-700"
              >
                Eliminar
              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <div
    *ngIf="registro.length === 0"
    class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100"
    role="alert"
  >
    <span class="font-medium">Información:</span>
    No hay registros de signos zodiacales.
  </div>

</div>
