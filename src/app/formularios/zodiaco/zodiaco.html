<div class="max-w-5xl mx-auto p-6 bg-white rounded-lg shadow">

  <div class="grid grid-cols-2 gap-8">

    <div>

      <form [formGroup]="formulario">

        <fieldset class="border border-gray-400 p-5">

          <legend class="text-lg font-medium px-2">
            Datos Personales
          </legend>

          <div class="mb-4">

            <label
              for="nombre"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Nombre
            </label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              formControlName="nombre"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Nombre"
            >

          </div>


          <div class="mb-4">

            <label
              for="apaterno"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Apellido paterno
            </label>

            <input
              type="text"
              id="apaterno"
              name="apaterno"
              formControlName="apaterno"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Apellido paterno"
            >

          </div>


          <div class="mb-4">

            <label
              for="amaterno"
              class="block mb-2 text-sm font-medium text-gray-900"
            >
              Apellido materno
            </label>

            <input
              type="text"
              id="amaterno"
              name="amaterno"
              formControlName="amaterno"
              required
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                     focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Apellido materno"
            >

          </div>


          <div class="mb-4">

            <label class="block mb-2 text-sm font-medium text-gray-900">
              Fecha de nacimiento
            </label>

            <div class="grid grid-cols-3 gap-2">

              <div>

                <label
                  for="dia"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Día
                </label>

                <input
                  type="number"
                  id="dia"
                  name="dia"
                  formControlName="dia"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Día"
                >

              </div>


              <div>

                <label
                  for="mes"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Mes
                </label>

                <input
                  type="number"
                  id="mes"
                  name="mes"
                  formControlName="mes"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Mes"
                >

              </div>


              <div>

                <label
                  for="anio"
                  class="block mb-1 text-sm text-gray-900"
                >
                  Año
                </label>

                <input
                  type="number"
                  id="anio"
                  name="anio"
                  formControlName="anio"
                  required
                  class="bg-gray-50 border border-gray-300 text-gray-900
                         text-sm rounded-lg block w-full p-2"
                  placeholder="Año"
                >

              </div>

            </div>

          </div>


          <div class="mb-5">

            <label class="block mb-2 text-sm font-medium text-gray-900">
              Sexo
            </label>

            <div class="flex flex-col gap-2">

              <label class="flex items-center">
                <input
                  type="radio"
                  name="sexo"
                  value="Masculino"
                  formControlName="sexo"
                  class="w-4 h-4"
                >
                <span class="ml-2 text-sm text-gray-900">
                  Masculino
                </span>
              </label>

              <label class="flex items-center">
                <input
                  type="radio"
                  name="sexo"
                  value="Femenino"
                  formControlName="sexo"
                  class="w-4 h-4"
                >
                <span class="ml-2 text-sm text-gray-900">
                  Femenino
                </span>
              </label>

            </div>

          </div>


          <div class="flex justify-center mt-5">

            <button
              type="submit"
              (click)="imprimir()"
              class="text-white bg-blue-700 hover:bg-blue-800
                     focus:ring-4 focus:outline-none focus:ring-blue-300
                     font-medium rounded-lg text-sm px-5 py-2.5"
            >
              Imprimir
            </button>

          </div>

        </fieldset>

      </form>

    </div>


    <div class="border-l-4 border-gray-800 pl-8 flex items-center">

      <div class="text-center w-full">
        @if (mostrar) {
        <p class="text-xl mb-6">
          Hola
          <strong class="italic">
            {{usuario.nombre}}
            {{usuario.apaterno}}
            {{usuario.amaterno}}
          </strong>
        </p>

        <p class="text-xl mb-6">
          Tienes {{edad}} años
        </p>

        <p class="text-xl mb-2">
          tu signo zodiacal
        </p>

        <p class="text-xl mb-4">
          Es {{signo}}
        </p>

        <img
          [src]="imagen"
          [alt]="signo"
          class="w-60 h-60 mx-auto object-contain"
        >
      }
      </div>

    </div>

  </div>

</div>
